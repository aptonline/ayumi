# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Daily photo habit
    description                           : Capture one meaningful photo each day and turn a small routine into a personal visual timeline.
    fontawesome_icon_name                 : camera

  - title                                 : Guided face alignment
    description                           : Use the front camera with an on-screen guide to keep your face position steady. Ayumi automatically aligns each photo, keeping every frame perfectly matched from day to day.
    fontawesome_icon_name                 : expand

  - title                                 : Automatic capture
    description                           : Ayumi checks face and eye clarity, then captures automatically when you are lined up and ready.
    fontawesome_icon_name                 : crosshairs

  - title                                 : Streaks and trophies
    description                           : Track your current and longest photo streaks, unlock eight milestone trophies, and celebrate your progress.
    fontawesome_icon_name                 : trophy

  - title                                 : Home Screen widgets
    description                           : Keep today’s status, your best streak, and your favourite earned trophy visible on your Home Screen.
    fontawesome_icon_name                 : table

  - title                                 : Playback and sharing
    description                           : Watch your aligned photos come together, then export the finished sequence as a video or GIF.
    fontawesome_icon_name                 : film
 



