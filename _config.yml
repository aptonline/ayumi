# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Daily photo habit
    description                           : Ayumi helps you capture a consistent daily selfie with a calm and repeatable process, prioritising consistency over perfection.

    fontawesome_icon_name                 : camera
    
  - title                                 : Auto-magical alignment
    description                           : The app automatically aligns to your eyes, keeping everything in place.
.
    fontawesome_icon_name                 : magic

  - title                                 : Watch your progress
    description                           : Turn your saved photos into a simple playback so you can see subtle changes over days, weeks, and months.
    fontawesome_icon_name                 : play-circle

  - title                                 : Streaks that stay motivating
    description                           : Build a daily streak, track your best run, and keep your progress visible with home-screen widgets.
    fontawesome_icon_name                 : chart

  - title                                 : Trophies for milestones
    description                           : Earn visual rewards as your streak grows, then pin your favourite trophy to the widget showcase.
    fontawesome_icon_name                 : trophy
 



